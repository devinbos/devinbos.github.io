<!DOCTYPE html>
<!-- About Section-->
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    const savedTheme = localStorage.getItem("theme");
      if (savedTheme){
         document.documentElement.setAttribute("data-theme", savedTheme);
      }
    </script>
    <link rel="stylesheet" href="branding.css">
    <script src = "js/theme.js"></script>
    <script src = "js/blog.js"></script>
    <script src= "js/components.js"></script>
    <script src= "js/filter.js"></script>

    <!-- Contains styles for the header and footer of the page and styles for the other content on the page-->
  <style>
    .container {
        display: flex;
        flex-direction: column;
        margin: 10px;
        padding: 20px;
        font-size: 30px;
    }

    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    li {
        float: left;
     }
    .newsDisplay{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 20px;;
      }

  </style>
  <title>News</title>
</head>
<body>
<div id="header-placeholder"></div>

<h1 style="font-size: 45px;">News</h1>
<input type="text" id="filter-input" placeholder="Search...">
<section id = "blog-list" class="newsDisplay">
</section>
<h3 id = "no-results" style="display:none;">Sorry, no result can be found for your search</h3>

<div id="footer-placeholder"></div>

  </body>
 </html>
